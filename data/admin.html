<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Kremų Namai</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#c9799f;--pink-d:#a85a80;--pink-l:#f6dce8;--bg:#fbf6f8;--txt:#38292f;--mut:#93737f;--line:#f0dde6}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{background:#fff;border-bottom:1px solid var(--line);padding:13px 0;margin-bottom:18px;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:1.15em;color:var(--pink-d);font-family:Georgia,serif}
h2{font-size:1.05em;color:var(--pink-d);margin-bottom:10px}
a{color:var(--pink-d)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(168,90,128,.07)}
input,textarea,select{width:100%;padding:12px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fdfafc}
input:focus,textarea:focus{outline:none;border-color:var(--pink)}
label{font-size:.88em;color:var(--mut);display:block;margin-bottom:3px}
.btn{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-size:1em;cursor:pointer;width:100%}
.btn:disabled{opacity:.55}
.btn2{background:#fff;color:var(--pink-d);border:1.5px solid var(--pink);border-radius:9px;padding:8px 13px;font:inherit;font-size:.9em;cursor:pointer}
.btn-del{border-color:#d88;color:#b55}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:none}
.row img,.row .noimg{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--pink-l);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.3em}
.row .g{flex:1;min-width:0}
.row .g b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g span{font-size:.88em;color:var(--mut)}
.row .acts{display:flex;gap:6px}
.photo-box{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;margin-bottom:10px;cursor:pointer;color:var(--mut)}
.photo-box img{max-width:100%;max-height:180px;border-radius:9px}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:11px 24px;border-radius:22px;opacity:0;transition:.3s;pointer-events:none;max-width:92%;text-align:center;z-index:10}
#msg.show{opacity:1}
.hidden{display:none}
.muted{color:var(--mut);font-size:.9em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chk input{width:auto;margin:0}
</style>
</head>
<body>

<header><div class="wrap">
  <h1>🌸 Admin</h1>
  <div><a href="/">← Parduotuvė</a> <button class="btn2 hidden" id="logout" onclick="logout()">Atsijungti</button></div>
</div></header>

<div class="wrap">

<!-- Prisijungimas -->
<div class="card" id="login">
  <h2>Prisijungimas</h2>
  <label>Admin raktas</label>
  <input type="password" id="key" placeholder="Raktas" autocomplete="current-password">
  <button class="btn" onclick="doLogin()">Prisijungti</button>
</div>

<!-- Produktų sąrašas -->
<div class="card hidden" id="listBox">
  <h2>Produktai <span class="muted" id="cnt"></span></h2>
  <div id="list"></div>
  <br><button class="btn" onclick="editP(null)">＋ Naujas produktas</button>
</div>

<!-- Redagavimo forma -->
<div class="card hidden" id="formBox">
  <h2 id="formT">Naujas produktas</h2>
  <div class="photo-box" onclick="document.getElementById('file').click()" id="pbox">
    📷 Paspauskite nuotraukai įkelti
  </div>
  <input type="file" id="file" accept="image/*" class="hidden" onchange="pickPhoto(this)">
  <label>Pavadinimas *</label>
  <input id="f_n" maxlength="60" placeholder="pvz. Rožių veido kremas">
  <div class="grid2">
    <div><label>Kaina € *</label><input id="f_p" type="number" step="0.01" min="0" inputmode="decimal" placeholder="14.90"></div>
    <div><label>Kategorija</label><input id="f_c" list="cats" maxlength="20" placeholder="Veidui"><datalist id="cats"></datalist></div>
  </div>
  <label>Aprašymas</label>
  <textarea id="f_d" rows="3" maxlength="300" placeholder="Trumpas aprašymas (nebūtina)"></textarea>
  <div class="chk"><input type="checkbox" id="f_feat"><label for="f_feat" style="margin:0">Rodyti pradžios puslapyje</label></div>
  <button class="btn" id="saveBtn" onclick="saveP()">Išsaugoti</button>
  <br><br><button class="btn2" style="width:100%" onclick="closeForm()">Atšaukti</button>
</div>

</div>
<div id="msg" role="status"></div>

<script>
const COLS = ['#e8b4c8','#b8a8d8','#e8c890','#a8d8b0','#f0b878','#f0a060','#90d0c0','#f0d8a0','#c8b8a8','#a8c8e0'];
let KEY = localStorage.getItem('akey') || '';
let P = [];        // produktų masyvas (pilnai valdomas čia, ESP32 tik saugo)
let editId = null; // null = naujas
let photoBlob = null;

const $ = id => document.getElementById(id);
let msgT;
function msg(t){ const m=$('msg'); m.textContent=t; m.classList.add('show'); clearTimeout(msgT); msgT=setTimeout(()=>m.classList.remove('show'),2600); }

// --- prisijungimas ---
async function doLogin(k) {
  const key = k !== undefined ? k : $('key').value.trim();
  if (!key) return;
  try {
    const r = await fetch('/api/admin/check?key=' + encodeURIComponent(key));
    if (!r.ok) { msg('❌ Neteisingas raktas'); localStorage.removeItem('akey'); return; }
  } catch(e) { msg('❌ Nepavyko prisijungti prie ESP32'); return; }
  KEY = key;
  localStorage.setItem('akey', key);
  $('login').classList.add('hidden');
  $('logout').classList.remove('hidden');
  await loadP();
  renderList();
  $('listBox').classList.remove('hidden');
}
function logout(){ localStorage.removeItem('akey'); location.reload(); }
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// --- produktai ---
async function loadP() {
  try {
    const r = await fetch('/api/products', {cache:'no-store'});
    if (r.ok) { const j = await r.json(); if (Array.isArray(j)) { P = j; return; } }
  } catch(e) {}
  // fallback: pradiniai produktai iš app.js
  try {
    const t = await (await fetch('app.js', {cache:'no-store'})).text();
    const m = t.match(/let P = \[([\s\S]*?)\n\];/);
    if (m) P = eval('[' + m[1] + ']');
  } catch(e) { P = []; }
}
function renderList() {
  $('cnt').textContent = '(' + P.length + ')';
  $('list').innerHTML = P.map(p => `<div class="row">
    <img src="img/p${p.id}.jpg${p.v?'?v='+p.v:''}" onerror="this.outerHTML='<div class=noimg>🧴</div>'">
    <div class="g"><b>${esc(p.n)}</b><span>${p.c ? esc(p.c)+' · ' : ''}${(+p.p).toFixed(2).replace('.',',')} €${p.feat?' · ⭐':''}</span></div>
    <div class="acts">
      <button class="btn2" onclick="editP(${p.id})">✎</button>
      <button class="btn2 btn-del" onclick="delP(${p.id})">✕</button>
    </div>
  </div>`).join('') || '<p class="muted">Produktų nėra. Pridėkite pirmą!</p>';
  const cats = [...new Set(P.map(p=>p.c).filter(Boolean))];
  $('cats').innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join('');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

// --- forma ---
function editP(id) {
  editId = id;
  photoBlob = null;
  const p = id ? P.find(x=>x.id===id) : null;
  $('formT').textContent = p ? 'Redaguoti: ' + p.n : 'Naujas produktas';
  $('f_n').value = p ? p.n : '';
  $('f_p').value = p ? p.p : '';
  $('f_c').value = p ? (p.c||'') : '';
  $('f_d').value = p ? (p.d||'') : '';
  $('f_feat').checked = p ? !!p.feat : false;
  $('pbox').innerHTML = '📷 Paspauskite nuotraukai įkelti';
  if (p) {
    const im = new Image();
    im.src = 'img/p' + p.id + '.jpg' + (p.v?'?v='+p.v:'');
    im.onload = () => { $('pbox').innerHTML = ''; $('pbox').appendChild(im); };
  }
  $('listBox').classList.add('hidden');
  $('formBox').classList.remove('hidden');
  window.scrollTo(0,0);
}
function closeForm(){ $('formBox').classList.add('hidden'); $('listBox').classList.remove('hidden'); }

// Nuotrauka: sumažinama telefone iki 800px JPEG (kad tilptų į LittleFS)
function pickPhoto(inp) {
  const f = inp.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const MAX = 800;
    const k = Math.min(1, MAX / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k);
    cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => {
      photoBlob = b;
      const pv = new Image();
      pv.src = URL.createObjectURL(b);
      $('pbox').innerHTML = '';
      $('pbox').appendChild(pv);
      const i = document.createElement('div');
      i.className = 'muted';
      i.textContent = 'Nauja nuotrauka: ' + Math.round(b.size/1024) + ' KB';
      $('pbox').appendChild(i);
      URL.revokeObjectURL(img.src);
    }, 'image/jpeg', 0.82);
  };
  img.src = URL.createObjectURL(f);
}

// --- išsaugojimas ---
async function saveP() {
  const n = $('f_n').value.trim();
  const p = parseFloat($('f_p').value);
  if (!n) { msg('Įveskite pavadinimą'); return; }
  if (!(p > 0)) { msg('Įveskite kainą'); return; }
  const btn = $('saveBtn');
  btn.disabled = true; btn.textContent = 'Saugoma…';
  try {
    let prod;
    if (editId) {
      prod = P.find(x=>x.id===editId);
    } else {
      const id = P.reduce((m,x)=>Math.max(m,x.id),0) + 1;
      prod = { id, col: COLS[(id-1) % COLS.length], i: [] };
      P.push(prod);
    }
    prod.n = n;
    prod.p = +p.toFixed(2);
    prod.c = $('f_c').value.trim() || 'Kita';
    prod.d = $('f_d').value.trim();
    prod.feat = $('f_feat').checked ? 1 : 0;
    if (photoBlob) {
      const r = await fetch('/api/admin/upload?key=' + encodeURIComponent(KEY) + '&name=p' + prod.id + '.jpg', {
        method: 'POST',
        body: (() => { const fd = new FormData(); fd.append('file', photoBlob, 'p' + prod.id + '.jpg'); return fd; })()
      });
      if (!r.ok) throw new Error('upload');
      prod.v = Date.now(); // cache busting
    }
    const r2 = await fetch('/api/admin/save?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(P)
    });
    if (!r2.ok) throw new Error('save');
    msg('✅ Išsaugota');
    renderList();
    closeForm();
  } catch(e) {
    msg('❌ Klaida saugant – bandykite dar kartą');
  }
  btn.disabled = false; btn.textContent = 'Išsaugoti';
}

async function delP(id) {
  const p = P.find(x=>x.id===id);
  if (!p || !confirm('Ištrinti „' + p.n + '"?')) return;
  P = P.filter(x=>x.id!==id);
  try {
    const r = await fetch('/api/admin/save?key=' + encodeURIComponent(KEY), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(P)
    });
    if (!r.ok) throw new Error();
    fetch('/api/admin/rmimg?key=' + encodeURIComponent(KEY) + '&name=p' + id + '.jpg').catch(()=>{});
    msg('🗑 Ištrinta');
  } catch(e) { msg('❌ Klaida'); }
  renderList();
}

// auto-login jei raktas išsaugotas
if (KEY) doLogin(KEY);
</script>
</body>
</html>
